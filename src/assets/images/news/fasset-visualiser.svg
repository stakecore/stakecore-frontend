<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="vaultGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a90b8" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#4a90b8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#4a90b8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="platformClip">
      <ellipse cx="240" cy="108" rx="150" ry="26"/>
    </clipPath>
  </defs>

  <rect width="480" height="300" fill="#0b1020"/>

  <!-- Ground plane, carrying the XRP mark. Flattened to match the low camera. -->
  <ellipse cx="240" cy="286" rx="168" ry="12" fill="#080c16"/>
  <g opacity="0.30" fill="#9aa0a8" transform="translate(240,286) scale(1,0.30)">
    <path d="M-44-40 h19 l25 29 25-29 h19 l-35 40 35 40 h-19 l-25-29 -25 29 h-19 l35-40 z"/>
  </g>

  <!-- Tunnels. Deliberately irregular: widths run 10 to 40 and depths 58 to
       168, they cluster and overlap rather than sitting on a ring, and the
       camera sits near their level rather than above the platform — evenly
       spaced columns under a disc read as furniture, not as data.
       Each one is split: minted backing fills from below (dark), free
       capacity sits above it (lit), with the fill line between them.
       Drawn back to front. -->
  <g>
    <!-- free capacity (above) -->
    <g fill="#c9385f" opacity="0.34">
      <rect x="191" y="90" width="10" height="38"/>
      <rect x="143" y="92" width="14" height="33"/>
      <rect x="322" y="92" width="16" height="18"/>
      <rect x="283" y="94" width="34" height="60"/>
      <rect x="155" y="96" width="26" height="38"/>
      <rect x="212" y="104" width="40" height="84"/>
      <rect x="256" y="108" width="12" height="46"/>
      <rect x="118" y="116" width="20" height="21"/>
      <rect x="181" y="122" width="30" height="49"/>
      <rect x="275" y="126" width="22" height="57"/>
    </g>
    <!-- minted backing (below) -->
    <g fill="#2e1a24" opacity="0.88">
      <rect x="191" y="128" width="10" height="20"/><ellipse cx="196" cy="148" rx="5" ry="1.8"/>
      <rect x="143" y="125" width="14" height="41"/><ellipse cx="150" cy="166" rx="7" ry="2.5"/>
      <rect x="322" y="110" width="16" height="74"/><ellipse cx="330" cy="184" rx="8" ry="2.9"/>
      <rect x="283" y="154" width="34" height="90"/><ellipse cx="300" cy="244" rx="17" ry="6.1"/>
      <rect x="155" y="134" width="26" height="90"/><ellipse cx="168" cy="224" rx="13" ry="4.7"/>
      <rect x="212" y="188" width="40" height="84"/><ellipse cx="232" cy="272" rx="20" ry="7.2"/>
      <rect x="256" y="154" width="12" height="20"/><ellipse cx="262" cy="174" rx="6" ry="2.2"/>
      <rect x="118" y="137" width="20" height="65"/><ellipse cx="128" cy="202" rx="10" ry="3.6"/>
      <rect x="181" y="171" width="30" height="91"/><ellipse cx="196" cy="262" rx="15" ry="5.4"/>
      <rect x="275" y="183" width="22" height="47"/><ellipse cx="286" cy="230" rx="11" ry="4"/>
    </g>
    <!-- the fill line where minted meets free -->
    <g fill="none" stroke="#ff7fa3" stroke-width="1" opacity="0.7">
      <ellipse cx="196" cy="128" rx="5" ry="1.8"/>
      <ellipse cx="150" cy="125" rx="7" ry="2.5"/>
      <ellipse cx="330" cy="110" rx="8" ry="2.9"/>
      <ellipse cx="300" cy="154" rx="17" ry="6.1"/>
      <ellipse cx="168" cy="134" rx="13" ry="4.7"/>
      <ellipse cx="232" cy="188" rx="20" ry="7.2"/>
      <ellipse cx="262" cy="154" rx="6" ry="2.2"/>
      <ellipse cx="128" cy="137" rx="10" ry="3.6"/>
      <ellipse cx="196" cy="171" rx="15" ry="5.4"/>
      <ellipse cx="286" cy="183" rx="11" ry="4"/>
    </g>
  </g>

  <!-- The platform, flattened by the low camera, with the Flare mark across
       it. Kept translucent: the tunnels beneath it are the subject. -->
  <ellipse cx="240" cy="108" rx="150" ry="26" fill="#7b1e32" opacity="0.66"/>
  <g clip-path="url(#platformClip)" opacity="0.34" fill="#8a8f96">
    <path d="M206 96 l34 0 -24 22 -34 0 z"/>
    <path d="M252 96 l34 0 -24 22 -34 0 z"/>
    <ellipse cx="300" cy="112" rx="10" ry="4"/>
  </g>
  <ellipse cx="240" cy="108" rx="150" ry="26" fill="none" stroke="#9fe0c0" stroke-width="0.7" opacity="0.30"/>

  <!-- Mint rims: the "Normal" agent status, capping each tunnel. -->
  <g fill="none" stroke="#9fe0c0" stroke-width="1" opacity="0.6">
    <ellipse cx="196" cy="90" rx="5" ry="1.8"/>
    <ellipse cx="150" cy="92" rx="7" ry="2.5"/>
    <ellipse cx="330" cy="92" rx="8" ry="2.9"/>
    <ellipse cx="300" cy="94" rx="17" ry="6.1"/>
    <ellipse cx="168" cy="96" rx="13" ry="4.7"/>
    <ellipse cx="232" cy="104" rx="20" ry="7.2"/>
    <ellipse cx="262" cy="108" rx="6" ry="2.2"/>
    <ellipse cx="128" cy="116" rx="10" ry="3.6"/>
    <ellipse cx="196" cy="122" rx="15" ry="5.4"/>
    <ellipse cx="286" cy="126" rx="11" ry="4"/>
  </g>

  <!-- Core vault: an open wireframe polyhedron with two orbital rings. -->
  <circle cx="240" cy="40" r="40" fill="url(#vaultGlow)"/>
  <g fill="none" stroke="#4a90b8" stroke-width="1" opacity="0.8">
    <path d="M240 17 l20 12 0 23 -20 12 -20-12 0-23 z"/>
    <path d="M240 17 l0 47 M220 29 l40 23 M260 29 l-40 23"/>
  </g>
  <g fill="none" stroke="#5aa8cf" stroke-width="1.1" opacity="0.72">
    <ellipse cx="240" cy="40" rx="24" ry="7"/>
    <ellipse cx="240" cy="40" rx="24" ry="7" transform="rotate(72 240 40)"/>
  </g>
</svg>
