<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" preserveAspectRatio="xMidYMid slice">
  <!-- Two networks, bridged by agents.

       The upper disk is Flare, carrying its mark; the lower disk is XRP,
       carrying its own. The five tunnels are the agents, and every one spans
       the full distance between the two — that connection is the point of the
       object, and a tunnel stopping in mid-air would describe nothing.

       Each agent is Flare's colour at its Flare end and the XRP mark's grey at
       its XRP end, meeting halfway: the bridge is in the colouring itself, not
       just in the geometry. Width still varies, because backing capacity does,
       and the ring at each seam carries the agent's status — green for Normal,
       red for the liquidation states. The wireframe above is the core vault. -->
  <defs>
    <radialGradient id="vaultGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a90b8" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#4a90b8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#4a90b8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="flareClip">
      <ellipse cx="240" cy="95" rx="150" ry="26"/>
    </clipPath>
    <clipPath id="xrpClip">
      <ellipse cx="240" cy="265" rx="150" ry="28"/>
    </clipPath>
  </defs>

  <rect width="480" height="300" fill="#0b1020"/>

  <!-- The XRP network: a disk in its own right, not a shadow. -->
  <ellipse cx="240" cy="265" rx="150" ry="28" fill="#162034"/>
  <!-- The clip must sit on an outer group: clipPath coordinates share the
       referencing element's user space, so putting both clip-path and
       transform on one element transforms the clip too and erases the mark. -->
  <g clip-path="url(#xrpClip)">
    <g opacity="0.42" fill="#9aa0a8" transform="translate(240,265) scale(1,0.30)">
      <path d="M-52-48 h22 l30 34 30-34 h22 l-41 48 41 48 h-22 l-30-34 -30 34 h-22 l41-48 z"/>
    </g>
  </g>
  <ellipse cx="240" cy="265" rx="150" ry="28" fill="none" stroke="#7d9bba" stroke-width="0.9" opacity="0.45"/>

  <!-- Agents, drawn back to front. -->
  <g>
    <!-- Flare half (upper), capped with the same ellipse the XRP end gets so
         both ends of an agent are round. -->
    <g fill="#b02a4e" opacity="0.46">
      <rect x="199" y="82" width="16" height="85"/><ellipse cx="207" cy="82" rx="8" ry="2.9"/>
      <rect x="293" y="87" width="20" height="85"/><ellipse cx="303" cy="87" rx="10" ry="3.6"/>
      <rect x="132" y="99" width="30" height="85"/><ellipse cx="147" cy="99" rx="15" ry="5.4"/>
      <rect x="335" y="102" width="26" height="85"/><ellipse cx="348" cy="102" rx="13" ry="4.7"/>
      <rect x="228" y="109" width="42" height="86"/><ellipse cx="249" cy="109" rx="21" ry="7.6"/>
    </g>
    <!-- XRP half (lower), in the grey of the XRP mark below -->
    <g fill="#9aa0a8" opacity="0.34">
      <rect x="199" y="167" width="16" height="84"/><ellipse cx="207" cy="251" rx="8" ry="2.9"/>
      <rect x="293" y="172" width="20" height="85"/><ellipse cx="303" cy="257" rx="10" ry="3.6"/>
      <rect x="132" y="184" width="30" height="85"/><ellipse cx="147" cy="269" rx="15" ry="5.4"/>
      <rect x="335" y="187" width="26" height="85"/><ellipse cx="348" cy="272" rx="13" ry="4.7"/>
      <rect x="228" y="195" width="42" height="85"/><ellipse cx="249" cy="280" rx="21" ry="7.6"/>
    </g>
    <!-- The seam where the two halves meet, and the only rings in the piece.
         Colour is agent status, as the app's own legend has it: green for
         Normal, red for the liquidation states. Mixed across the field rather
         than grouped, because status does not correlate with position. -->
    <g fill="none" stroke="#5be2a0" stroke-width="1.5" opacity="0.85">
      <ellipse cx="303" cy="172" rx="10" ry="3.6"/>
      <ellipse cx="147" cy="184" rx="15" ry="5.4"/>
      <ellipse cx="249" cy="195" rx="21" ry="7.6"/>
    </g>
    <g fill="none" stroke="#ff5470" stroke-width="1.5" opacity="0.85">
      <ellipse cx="207" cy="167" rx="8" ry="2.9"/>
      <ellipse cx="348" cy="187" rx="13" ry="4.7"/>
    </g>
  </g>

  <!-- The Flare network, translucent so the agents read through it. -->
  <ellipse cx="240" cy="95" rx="150" ry="26" fill="#7b1e32" opacity="0.68"/>
  <g clip-path="url(#flareClip)" opacity="0.34" fill="#8a8f96">
    <path d="M206 83 l34 0 -24 22 -34 0 z"/>
    <path d="M252 83 l34 0 -24 22 -34 0 z"/>
    <ellipse cx="300" cy="99" rx="10" ry="4"/>
  </g>
  <ellipse cx="240" cy="95" rx="150" ry="26" fill="none" stroke="#9fe0c0" stroke-width="0.7" opacity="0.32"/>

  <!-- Core vault: an open wireframe polyhedron with two orbital rings. -->
  <circle cx="240" cy="36" r="36" fill="url(#vaultGlow)"/>
  <g fill="none" stroke="#4a90b8" stroke-width="1" opacity="0.82">
    <path d="M240 15 l18 11 0 21 -18 11 -18-11 0-21 z"/>
    <path d="M240 15 l0 43 M222 26 l36 21 M258 26 l-36 21"/>
  </g>
  <g fill="none" stroke="#5aa8cf" stroke-width="1.1" opacity="0.72">
    <ellipse cx="240" cy="36" rx="22" ry="6.5"/>
    <ellipse cx="240" cy="36" rx="22" ry="6.5" transform="rotate(72 240 36)"/>
  </g>
</svg>
