<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="vaultGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a90b8" stop-opacity="0.20"/>
      <stop offset="65%" stop-color="#4a90b8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#4a90b8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="platformClip">
      <ellipse cx="240" cy="150" rx="140" ry="45"/>
    </clipPath>
  </defs>

  <rect width="480" height="300" fill="#0b1020"/>

  <!-- Ground plane, carrying the XRP mark. -->
  <ellipse cx="240" cy="276" rx="150" ry="19" fill="#080c16"/>
  <g opacity="0.26" fill="#9aa0a8" transform="translate(240,276) scale(1,0.28)">
    <path d="M-28-26 h12 l16 19 16-19 h12 l-22 26 22 26 h-12 l-16-19 -16 19 h-12 l22-26 z"/>
  </g>

  <!-- Tunnels. Width is total backing capacity, so they vary; depth varies
       too. Drawn before the platform so its translucency lets the bodies
       show through, with the mint rims redrawn on top to sit on the surface. -->
  <g fill="#a02040">
    <g opacity="0.30">
      <rect x="161" y="140" width="18" height="58"/><ellipse cx="170" cy="198" rx="9" ry="3.4"/>
      <rect x="222" y="124" width="36" height="98"/><ellipse cx="240" cy="222" rx="18" ry="6"/>
      <rect x="303" y="138" width="14" height="44"/><ellipse cx="310" cy="182" rx="7" ry="2.8"/>
      <rect x="129" y="156" width="24" height="100"/><ellipse cx="141" cy="256" rx="12" ry="4.4"/>
      <rect x="329" y="152" width="30" height="76"/><ellipse cx="344" cy="228" rx="15" ry="5.2"/>
      <rect x="194" y="178" width="12" height="46"/><ellipse cx="200" cy="224" rx="6" ry="2.4"/>
      <rect x="272" y="180" width="26" height="92"/><ellipse cx="285" cy="272" rx="13" ry="4.8"/>
    </g>
  </g>

  <!-- The platform, with the Flare mark across it. Kept translucent: the
       tunnels beneath it are the data, and hiding them makes it furniture. -->
  <ellipse cx="240" cy="150" rx="140" ry="45" fill="#7b1e32" opacity="0.70"/>
  <g clip-path="url(#platformClip)" opacity="0.30" fill="#8a8f96">
    <path d="M208 138 l30 0 -21 28 -30 0 z"/>
    <path d="M251 138 l30 0 -21 28 -30 0 z"/>
    <ellipse cx="288" cy="160" rx="9" ry="5"/>
  </g>
  <ellipse cx="240" cy="150" rx="140" ry="45" fill="none" stroke="#9fe0c0" stroke-width="0.7" opacity="0.28"/>

  <!-- Mint rims: the "Normal" agent status, capping each tunnel. Deliberately
       dimmer and thinner than the coins, so the two do not read alike. -->
  <g fill="none" stroke="#9fe0c0" stroke-width="1" opacity="0.55">
    <ellipse cx="170" cy="140" rx="9" ry="3.4"/>
    <ellipse cx="240" cy="124" rx="18" ry="6"/>
    <ellipse cx="310" cy="138" rx="7" ry="2.8"/>
    <ellipse cx="141" cy="156" rx="12" ry="4.4"/>
    <ellipse cx="344" cy="152" rx="15" ry="5.2"/>
    <ellipse cx="200" cy="178" rx="6" ry="2.4"/>
    <ellipse cx="285" cy="180" rx="13" ry="4.8"/>
  </g>

  <!-- Asset coins, seated on the rim: solid pale faces so they read as
       objects rather than as more rims. -->
  <g>
    <g fill="#dfe6ee" stroke="#9fe0c0" stroke-width="1.6">
      <ellipse cx="358" cy="162" rx="12" ry="5.5"/>
      <ellipse cx="266" cy="190" rx="12" ry="5.5"/>
      <ellipse cx="140" cy="176" rx="12" ry="5.5"/>
      <ellipse cx="196" cy="112" rx="12" ry="5.5"/>
      <ellipse cx="326" cy="118" rx="12" ry="5.5"/>
    </g>
    <g fill="#0b1020" opacity="0.55">
      <ellipse cx="358" cy="162" rx="4" ry="1.9"/>
      <ellipse cx="266" cy="190" rx="4" ry="1.9"/>
      <ellipse cx="140" cy="176" rx="4" ry="1.9"/>
      <ellipse cx="196" cy="112" rx="4" ry="1.9"/>
      <ellipse cx="326" cy="118" rx="4" ry="1.9"/>
    </g>
  </g>

  <!-- Core vault: an open wireframe polyhedron with two orbital rings. -->
  <circle cx="240" cy="52" r="44" fill="url(#vaultGlow)"/>
  <g fill="none" stroke="#4a90b8" stroke-width="1" opacity="0.8">
    <path d="M240 26 l22 13 0 26 -22 13 -22-13 0-26 z"/>
    <path d="M240 26 l0 52 M218 39 l44 26 M262 39 l-44 26"/>
  </g>
  <g fill="none" stroke="#5aa8cf" stroke-width="1.1" opacity="0.7">
    <ellipse cx="240" cy="52" rx="26" ry="9"/>
    <ellipse cx="240" cy="52" rx="26" ry="9" transform="rotate(72 240 52)"/>
  </g>
</svg>
