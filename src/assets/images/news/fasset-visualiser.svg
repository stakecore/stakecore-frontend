<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" preserveAspectRatio="xMidYMid slice">
  <!-- Two networks, bridged by agents.

       The upper disk is Flare, carrying its mark; the lower disk is XRP,
       carrying its own. The tunnels are the agents, and every one of them
       spans the full distance between the two — that connection is the whole
       point of the object, and a tunnel stopping in mid-air would describe
       nothing.

       What varies between tunnels is what actually differs between agents:
       width is total backing capacity, and the fill line is where minted
       backing (dark, below) gives way to free capacity (lit, above). The
       wireframe above is the core vault. -->
  <defs>
    <radialGradient id="vaultGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a90b8" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#4a90b8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#4a90b8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="flareClip">
      <ellipse cx="240" cy="95" rx="150" ry="26"/>
    </clipPath>
    <clipPath id="xrpClip">
      <ellipse cx="240" cy="265" rx="150" ry="28"/>
    </clipPath>
  </defs>

  <rect width="480" height="300" fill="#0b1020"/>

  <!-- The XRP network: a disk in its own right, not a shadow. -->
  <ellipse cx="240" cy="265" rx="150" ry="28" fill="#162034"/>
  <!-- The clip must sit on an outer group: clipPath coordinates share the
       referencing element's user space, so putting both clip-path and
       transform on one element transforms the clip too and erases the mark. -->
  <g clip-path="url(#xrpClip)">
    <g opacity="0.42" fill="#9aa0a8" transform="translate(240,265) scale(1,0.30)">
      <path d="M-52-48 h22 l30 34 30-34 h22 l-41 48 41 48 h-22 l-30-34 -30 34 h-22 l41-48 z"/>
    </g>
  </g>
  <ellipse cx="240" cy="265" rx="150" ry="28" fill="none" stroke="#7d9bba" stroke-width="0.9" opacity="0.45"/>

  <!-- Agents. Each spans Flare to XRP; the fill line is what differs. -->
  <g>
    <!-- free capacity (above the fill line) -->
    <g fill="#c9385f" opacity="0.32">
      <rect x="245" y="79" width="20" height="122"/>
      <rect x="174" y="81" width="11" height="110"/>
      <rect x="305" y="85" width="13" height="93"/>
      <rect x="124" y="87" width="16" height="77"/>
      <rect x="215" y="90" width="14" height="25"/>
      <rect x="352" y="91" width="10" height="102"/>
      <rect x="276" y="98" width="30" height="43"/>
      <rect x="133" y="99" width="28" height="48"/>
      <rect x="331" y="103" width="22" height="71"/>
      <rect x="171" y="104" width="36" height="86"/>
      <rect x="223" y="109" width="40" height="65"/>
    </g>
    <!-- minted backing (below the fill line) -->
    <g fill="#2e1a24" opacity="0.9">
      <rect x="245" y="201" width="20" height="47"/><ellipse cx="255" cy="248" rx="10" ry="3.6"/>
      <rect x="174" y="191" width="11" height="59"/><ellipse cx="180" cy="250" rx="5.5" ry="2"/>
      <rect x="305" y="178" width="13" height="76"/><ellipse cx="312" cy="254" rx="6.5" ry="2.3"/>
      <rect x="124" y="164" width="16" height="93"/><ellipse cx="132" cy="257" rx="8" ry="2.9"/>
      <rect x="215" y="115" width="14" height="144"/><ellipse cx="222" cy="259" rx="7" ry="2.5"/>
      <rect x="352" y="193" width="10" height="68"/><ellipse cx="357" cy="261" rx="5" ry="1.8"/>
      <rect x="276" y="141" width="30" height="127"/><ellipse cx="291" cy="268" rx="15" ry="5.4"/>
      <rect x="133" y="147" width="28" height="122"/><ellipse cx="147" cy="269" rx="14" ry="5"/>
      <rect x="331" y="174" width="22" height="99"/><ellipse cx="342" cy="273" rx="11" ry="4"/>
      <rect x="171" y="190" width="36" height="85"/><ellipse cx="189" cy="275" rx="18" ry="6.5"/>
      <rect x="223" y="174" width="40" height="106"/><ellipse cx="243" cy="280" rx="20" ry="7.2"/>
    </g>
    <!-- the fill line: where minted backing gives way to free capacity -->
    <g fill="none" stroke="#ff7fa3" stroke-width="1" opacity="0.72">
      <ellipse cx="255" cy="201" rx="10" ry="3.6"/>
      <ellipse cx="180" cy="191" rx="5.5" ry="2"/>
      <ellipse cx="312" cy="178" rx="6.5" ry="2.3"/>
      <ellipse cx="132" cy="164" rx="8" ry="2.9"/>
      <ellipse cx="222" cy="115" rx="7" ry="2.5"/>
      <ellipse cx="357" cy="193" rx="5" ry="1.8"/>
      <ellipse cx="291" cy="141" rx="15" ry="5.4"/>
      <ellipse cx="147" cy="147" rx="14" ry="5"/>
      <ellipse cx="342" cy="174" rx="11" ry="4"/>
      <ellipse cx="189" cy="190" rx="18" ry="6.5"/>
      <ellipse cx="243" cy="174" rx="20" ry="7.2"/>
    </g>
  </g>

  <!-- The Flare network, translucent so the agents read through it. -->
  <ellipse cx="240" cy="95" rx="150" ry="26" fill="#7b1e32" opacity="0.68"/>
  <g clip-path="url(#flareClip)" opacity="0.34" fill="#8a8f96">
    <path d="M206 83 l34 0 -24 22 -34 0 z"/>
    <path d="M252 83 l34 0 -24 22 -34 0 z"/>
    <ellipse cx="300" cy="99" rx="10" ry="4"/>
  </g>
  <ellipse cx="240" cy="95" rx="150" ry="26" fill="none" stroke="#9fe0c0" stroke-width="0.7" opacity="0.32"/>

  <!-- Mint rims where each agent meets Flare: the "Normal" agent status. -->
  <g fill="none" stroke="#9fe0c0" stroke-width="1" opacity="0.62">
    <ellipse cx="255" cy="79" rx="10" ry="3.6"/>
    <ellipse cx="180" cy="81" rx="5.5" ry="2"/>
    <ellipse cx="312" cy="85" rx="6.5" ry="2.3"/>
    <ellipse cx="132" cy="87" rx="8" ry="2.9"/>
    <ellipse cx="222" cy="90" rx="7" ry="2.5"/>
    <ellipse cx="357" cy="91" rx="5" ry="1.8"/>
    <ellipse cx="291" cy="98" rx="15" ry="5.4"/>
    <ellipse cx="147" cy="99" rx="14" ry="5"/>
    <ellipse cx="342" cy="103" rx="11" ry="4"/>
    <ellipse cx="189" cy="104" rx="18" ry="6.5"/>
    <ellipse cx="243" cy="109" rx="20" ry="7.2"/>
  </g>

  <!-- Core vault: an open wireframe polyhedron with two orbital rings. -->
  <circle cx="240" cy="36" r="36" fill="url(#vaultGlow)"/>
  <g fill="none" stroke="#4a90b8" stroke-width="1" opacity="0.82">
    <path d="M240 15 l18 11 0 21 -18 11 -18-11 0-21 z"/>
    <path d="M240 15 l0 43 M222 26 l36 21 M258 26 l-36 21"/>
  </g>
  <g fill="none" stroke="#5aa8cf" stroke-width="1.1" opacity="0.72">
    <ellipse cx="240" cy="36" rx="22" ry="6.5"/>
    <ellipse cx="240" cy="36" rx="22" ry="6.5" transform="rotate(72 240 36)"/>
  </g>
</svg>
